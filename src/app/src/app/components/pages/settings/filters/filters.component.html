<accordion [closeOthers]="oneAtATime" class="custom_accordion">
    <form class="filter-settings-form" [formGroup]="filterForm">
        <div style="display: flex;">
            <accordion-group heading="Sex">
                <div class="display_flex_padding">
                    <label for="filterOption{{ i }}" *ngFor="let option of male_femaleOptions; let i = index"
                        class="filter-settings-option"><span [ngClass]="{ active: filterForm.value.filterOrder === i }"
                            class="checkmark"></span>
                        {{ option }}
                        <input formControlName="filterOrder" type="radio" [value]="i" id="filterOption{{ i }}"
                            (change)="onchange()" />
                    </label>
                </div>
            </accordion-group>
            <a *ngIf="ischeckedradio" class="clear_button" (click)="clear()">Clear</a>
        </div>
        <accordion-group heading="Years">
            <div class="display_flex_padding">
                <span class="span_input">form: </span><input type="text" class="filter_input"><span
                    class="span_input span_to">to:</span><input type="text" class="filter_input">
            </div>
        </accordion-group>
        <div style="display: flex;">
            <accordion-group heading="Birth country">
                <div class="round_checkbox">
                    <div class="round" *ngFor="let country of birth_country; let i = index">
                        <label><span [ngClass]="{'chwckbox':country.isChecked == true}" class="uncheck"></span>
                            <input type="checkbox" id="" value="" formControlName="country" (change)="onchangecountry()"
                                [(ngModel)]="country.isChecked">{{country.name}}
                        </label>
                    </div>
                </div>
            </accordion-group>
            <a *ngIf="isCheckedcountry" class="clear_button"  (click)="clearcountry()">Clear</a>
        </div>
        <div style="display: flex;">
            <accordion-group heading="Place at the museum">
                <div class="round_checkbox">
                    <div class="round" *ngFor="let museum_name of place_at_museum; let i = index">
                        <label><span [ngClass]="{'chwckbox':museum_name.isChecked == true}" class="uncheck"></span>
                            <input type="checkbox" id="" value="" formControlName="museum" (change)="onchangemuseum()"
                                [(ngModel)]="museum_name.isChecked">{{museum_name.place_museum_name}}
                        </label>
                    </div>
                </div>
            </accordion-group>
            <a *ngIf="isCheckedmuseum" class="clear_button"  (click)="clear()">Clear</a>
        </div>
        <div style="display: flex;">
            <accordion-group heading="Profession">
                <div class="round_checkbox" *ngFor="let profession of professions; let i = index">
                    <div class="round">
                        <label><span [ngClass]="{'chwckbox':profession.isChecked == true}" class="uncheck"></span>
                            <input type="checkbox" id="" value="" formControlName="profession_name"
                                (change)="onchangeprofession()" [(ngModel)]="profession.isChecked">
                            <span class="bhf-theme"
                                [ngStyle]="{'backgroundColor':categoryColor(profession.profession_name)}">{{profession.profession_name
                                }}</span>
                        </label>
                    </div>
                </div>
            </accordion-group>
            <a *ngIf="isCheckrdprofession" class="clear_button"  (click)="clear()">Clear</a>
        </div>
    </form>
</accordion>
<!-- <button class="finish-button" [disabled]="filterForm.value">Filter</button> -->
<button class="finish-button">Filter</button>
